  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"fr\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Tableaux synthétiques des descripteurs — CECRL<\u002Ftitle>\n<style>\n  :root{\n    --paper:#ffffff;\n    --bg:#eceae3;\n    --ink:#23262b;\n    --ink-soft:#5b616b;\n    --ink-faint:#8b8f97;\n    --line:#dad8cf;\n    --line-soft:#e8e6dd;\n    --navy:oklch(0.34 0.045 250);\n    --navy-2:oklch(0.41 0.05 250);\n    --navy-tint:oklch(0.96 0.012 250);\n\n    /* échelle complète Pré A1 → C1 */\n    --preA1:oklch(0.60 0.045 250);\n    --a1:oklch(0.56 0.10 152);\n    --a2:oklch(0.60 0.10 72);\n    --b1:oklch(0.53 0.11 256);\n    --b2:oklch(0.50 0.12 312);\n    --c1:oklch(0.48 0.13 350);\n    --preA1-tint:oklch(0.967 0.012 250);\n    --a1-tint:oklch(0.972 0.018 152);\n    --a2-tint:oklch(0.975 0.022 78);\n    --b1-tint:oklch(0.97 0.018 256);\n    --b2-tint:oklch(0.968 0.020 312);\n    --c1-tint:oklch(0.966 0.020 350);\n\n    --sans:\"Helvetica Neue\",Helvetica,Arial,\"Liberation Sans\",sans-serif;\n    --maxw:1320px;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    font-family:var(--sans);color:var(--ink);background:var(--bg);\n    line-height:1.46;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;\n  }\n  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}\n\n  /* ---------- Masthead ---------- */\n  .masthead{background:var(--navy);color:#fff;border-bottom:3px solid oklch(0.62 0.10 72);}\n  .masthead .wrap{padding-top:30px;padding-bottom:28px;}\n  .eyebrow{\n    font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;\n    color:oklch(0.86 0.04 250);font-weight:600;margin:0 0 12px;\n    display:flex;align-items:center;gap:12px;\n  }\n  .eyebrow::after{content:\"\";flex:0 0 34px;height:1px;background:oklch(0.7 0.05 250);}\n  h1.title{font-size:31px;font-weight:700;letter-spacing:-.012em;margin:0 0 8px;line-height:1.08;}\n  .sub{font-size:15px;color:oklch(0.88 0.03 250);margin:0;max-width:74ch;}\n  .masthead .meta{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;}\n  .chip{\n    font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:5px 11px;border-radius:999px;\n    border:1px solid oklch(0.55 0.05 250);color:oklch(0.92 0.02 250);background:oklch(0.30 0.04 250);\n  }\n  .xlink{\n    margin-left:auto;font-size:12.5px;font-weight:600;text-decoration:none;\n    color:#fff;background:oklch(0.30 0.04 250);border:1px solid oklch(0.55 0.05 250);\n    padding:7px 13px;border-radius:7px;display:inline-flex;align-items:center;gap:8px;transition:.15s;\n  }\n  .xlink:hover{background:oklch(0.38 0.05 250);}\n  .xlink .arr{font-size:13px;}\n\n  /* ---------- Toolbar / tabs ---------- */\n  .toolbar{\n    position:sticky;top:0;z-index:20;background:rgba(248,247,243,.92);\n    backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);\n  }\n  .toolbar .wrap{display:flex;align-items:center;gap:18px;padding-top:0;padding-bottom:0;min-height:58px;flex-wrap:wrap;}\n  .tabs{display:flex;gap:2px;flex:1;flex-wrap:wrap;}\n  .tab{\n    appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;\n    font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:18px 14px 16px;position:relative;\n    letter-spacing:-.005em;border-bottom:3px solid transparent;transition:color .15s;white-space:nowrap;\n  }\n  .tab .idx{color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-right:7px;font-weight:600;}\n  .tab:hover{color:var(--ink);}\n  .tab[aria-selected=\"true\"]{color:var(--navy);border-bottom-color:oklch(0.62 0.10 72);}\n  .tab[aria-selected=\"true\"] .idx{color:var(--navy-2);}\n  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}\n  .btn{\n    appearance:none;font-family:inherit;font-size:12.5px;font-weight:600;\n    border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);\n    padding:8px 13px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;\n    transition:border-color .15s,color .15s,background .15s;white-space:nowrap;\n  }\n  .btn:hover{border-color:#c2c0b6;color:var(--ink);}\n  .btn .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-faint);transition:.15s;}\n  .btn.on{background:var(--navy);border-color:var(--navy);color:#fff;}\n  .btn.on .dot{background:oklch(0.78 0.12 72);border-color:oklch(0.78 0.12 72);}\n\n  /* ---------- Range presets ---------- */\n  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--paper);}\n  .seg-btn{appearance:none;border:0;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:8px 12px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;}\n  .seg-btn+.seg-btn{border-left:1px solid var(--line);}\n  .seg-btn:hover{color:var(--ink);}\n  .seg-btn[aria-pressed=\"true\"]{background:var(--navy);color:#fff;}\n\n  /* ---------- Level filter chips ---------- */\n  .lvfilter{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 7px;}\n  .lvfilter .flab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:0 3px 0 2px;}\n  .lvchip{\n    appearance:none;font-family:inherit;cursor:pointer;font-size:12px;font-weight:700;\n    border:1px solid var(--line);background:#fff;color:var(--ink-soft);\n    padding:5px 9px;border-radius:6px;transition:.13s;letter-spacing:.02em;\n  }\n  .lvchip[data-on=\"true\"]{color:#fff;border-color:transparent;}\n  .lvchip.preA1[data-on=\"true\"]{background:var(--preA1);}\n  .lvchip.a1[data-on=\"true\"]{background:var(--a1);}\n  .lvchip.a2[data-on=\"true\"]{background:var(--a2);}\n  .lvchip.b1[data-on=\"true\"]{background:var(--b1);}\n  .lvchip.b2[data-on=\"true\"]{background:var(--b2);}\n  .lvchip.c1[data-on=\"true\"]{background:var(--c1);}\n  .lvchip[data-on=\"false\"]{opacity:.55;}\n\n  /* ---------- Sheet ---------- */\n  main{padding:26px 0 70px;}\n  .mode{display:none;}\n  .mode.active{display:block;}\n\n  .sheet{\n    background:var(--paper);border:1px solid var(--line);border-radius:6px;\n    box-shadow:0 1px 0 rgba(0,0,0,.02),0 14px 34px -22px rgba(20,24,40,.35);\n    overflow:hidden;margin-bottom:26px;\n  }\n  .mode-head{\n    padding:22px 30px 20px;border-bottom:1px solid var(--line);\n    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;\n  }\n  .mode-head .lead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;}\n  .mode-no{\n    font-size:13px;font-weight:700;color:#fff;background:var(--navy);width:30px;height:30px;border-radius:6px;\n    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;align-self:center;\n  }\n  .mode-name{font-size:23px;font-weight:700;letter-spacing:-.015em;margin:0;}\n  .mode-tag{font-size:13px;color:var(--ink-soft);margin:0;font-weight:500;}\n  .legend{display:flex;gap:13px;align-items:center;flex-wrap:wrap;}\n  .legend .lv{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-soft);}\n  .lv .sw{width:12px;height:12px;border-radius:3px;}\n  .sw.preA1{background:var(--preA1);}.sw.a1{background:var(--a1);}.sw.a2{background:var(--a2);}\n  .sw.b1{background:var(--b1);}.sw.b2{background:var(--b2);}.sw.c1{background:var(--c1);}\n\n  .act-label{\n    font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--navy-2);\n    padding:20px 30px 0;margin:0;display:flex;align-items:baseline;gap:12px;\n  }\n  .act-label .as{font-size:11px;letter-spacing:.01em;text-transform:none;font-weight:500;color:var(--ink-faint);}\n  .act-label::after{content:\"\";flex:1;height:1px;background:var(--line-soft);align-self:center;}\n\n  .tblwrap{padding:12px 30px 6px;overflow-x:auto;}\n  .tbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;table-layout:fixed;}\n  .tbl col.c-th{width:148px;}\n  .tbl thead th{\n    font-size:12px;font-weight:700;text-align:left;padding:9px 13px;vertical-align:middle;\n    background:var(--navy);color:#fff;border-bottom:1px solid var(--navy);\n  }\n  .tbl thead th.th-h{background:var(--navy-2);letter-spacing:.04em;font-size:10.5px;text-transform:uppercase;}\n  .tbl thead th .badge{\n    font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:2px 9px;border-radius:5px;color:#1d2024;display:inline-block;\n  }\n  .badge.preA1{background:oklch(0.84 0.04 250);}\n  .badge.a1{background:oklch(0.82 0.12 152);}\n  .badge.a2{background:oklch(0.86 0.13 80);}\n  .badge.b1{background:oklch(0.82 0.12 256);}\n  .badge.b2{background:oklch(0.80 0.11 312);}\n  .badge.c1{background:oklch(0.80 0.12 350);}\n\n  .tbl td{\n    padding:12px 13px;font-size:12.4px;line-height:1.48;color:#34383f;\n    border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);vertical-align:top;\n  }\n  .tbl tr:last-child td{border-bottom:0;}\n  .tbl td:last-child{border-right:0;}\n  .tbl td.th{background:#fbfbf9;font-weight:600;color:var(--ink);font-size:12.5px;border-right:1px solid var(--line);}\n  .tbl td.lv{position:relative;}\n  .tbl td.lv.preA1{background:linear-gradient(var(--preA1) 0 0) left/3px 100% no-repeat,#fff;}\n  .tbl td.lv.a1{background:linear-gradient(var(--a1) 0 0) left/3px 100% no-repeat,#fff;}\n  .tbl td.lv.a2{background:linear-gradient(var(--a2) 0 0) left/3px 100% no-repeat,#fff;}\n  .tbl td.lv.b1{background:linear-gradient(var(--b1) 0 0) left/3px 100% no-repeat,#fff;}\n  .tbl td.lv.b2{background:linear-gradient(var(--b2) 0 0) left/3px 100% no-repeat,#fff;}\n  .tbl td.lv.c1{background:linear-gradient(var(--c1) 0 0) left/3px 100% no-repeat,#fff;}\n  .tbl td.lv.empty{color:var(--ink-faint);text-align:center;}\n  .tbl td.lv.empty::after{content:\"—\";}\n  .tbl tbody tr:hover td.lv:not(.empty){background-color:#fcfcfa;}\n\n  /* highlight mode */\n  body.eval .tbl td.lv:not(.empty){cursor:pointer;}\n  body.eval .tbl td.lv:not(.empty):hover{outline:2px solid var(--line);outline-offset:-2px;}\n  .tbl td.lv.mark.preA1{background:var(--preA1-tint);box-shadow:inset 0 0 0 2px var(--preA1);}\n  .tbl td.lv.mark.a1{background:var(--a1-tint);box-shadow:inset 0 0 0 2px var(--a1);}\n  .tbl td.lv.mark.a2{background:var(--a2-tint);box-shadow:inset 0 0 0 2px var(--a2);}\n  .tbl td.lv.mark.b1{background:var(--b1-tint);box-shadow:inset 0 0 0 2px var(--b1);}\n  .tbl td.lv.mark.b2{background:var(--b2-tint);box-shadow:inset 0 0 0 2px var(--b2);}\n  .tbl td.lv.mark.c1{background:var(--c1-tint);box-shadow:inset 0 0 0 2px var(--c1);}\n  .tbl td.lv.mark::before{content:\"✓\";position:absolute;top:6px;right:8px;font-size:12px;font-weight:800;}\n  .tbl td.lv.mark.preA1::before{color:var(--preA1);}\n  .tbl td.lv.mark.a1::before{color:var(--a1);}\n  .tbl td.lv.mark.a2::before{color:var(--a2);}\n  .tbl td.lv.mark.b1::before{color:var(--b1);}\n  .tbl td.lv.mark.b2::before{color:var(--b2);}\n  .tbl td.lv.mark.c1::before{color:var(--c1);}\n\n  .foot-note{font-size:11.5px;color:var(--ink-faint);padding:0 2px;margin:18px 0 0;text-align:center;}\n  .print-only{display:none;}\n\n  @media (max-width:760px){h1.title{font-size:25px;}}\n\n  /* ---------- Print : A4 paysage ---------- */\n  @media print{\n    @page{size:A4 landscape;margin:9mm 10mm;}\n    body{background:#fff;}\n    .toolbar,.masthead .meta,.legend,.foot-note,.xlink{display:none !important;}\n    .wrap{max-width:none;padding:0;}\n    main{padding:0;}\n    .masthead{background:#fff;color:var(--ink);border-bottom:2px solid var(--navy);}\n    .masthead .wrap{padding:0 0 8px;}\n    .eyebrow{color:var(--navy-2);}.eyebrow::after{background:var(--navy-2);}\n    .sub{color:var(--ink-soft);}\n    .mode{display:block !important;page-break-before:always;}\n    .mode:first-of-type{page-break-before:avoid;}\n    .sheet{border:1px solid #c9c7bd;border-radius:0;box-shadow:none;margin-bottom:0;}\n    .mode-head{padding:10px 14px;}\n    .mode-name{font-size:17px;}\n    .act-label{padding:10px 14px 0;}\n    .tblwrap{padding:8px 14px 4px;overflow:visible;}\n    .tbl td,.tbl thead th{padding:6px 8px;font-size:9px;line-height:1.32;}\n    .tbl td.th{font-size:9px;}\n    .tbl col.c-th{width:120px;}\n    .mode,.sheet,.tbl tr{break-inside:avoid;}\n    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n  <header class=\"masthead\">\n    <div class=\"wrap\">\n      <p class=\"eyebrow\">Langues vivantes · Anglais · CECRL<\u002Fp>\n      <h1 class=\"title\">Tableaux synthétiques des descripteurs<\u002Fh1>\n      <p class=\"sub\">Descripteurs « can-do » des activités langagières sur l'échelle complète du CECRL — de Pré A1 à C1. Réception, production, interaction et médiation. <em>Extrait des programmes du lycée — © Ministère de l'Éducation nationale et de la Jeunesse.<\u002Fem><\u002Fp>\n      <div class=\"meta\">\n        <span class=\"chip\">4 modes de communication<\u002Fspan>\n        <span class=\"chip\">Pré A1 · A1 · A2 · B1 · B2 · C1<\u002Fspan>\n        <span class=\"chip\" id=\"cntChip\"><\u002Fspan>\n        <a class=\"xlink\" href=\"Tableaux de descripteurs - Anglais.html\"><span class=\"arr\">←<\u002Fspan>Tableaux analytiques<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav class=\"toolbar\" aria-label=\"Modes de communication\">\n    <div class=\"wrap\">\n      <div class=\"tabs\" id=\"tabs\" role=\"tablist\"><\u002Fdiv>\n      <div class=\"tools\">\n        <div class=\"seg\" id=\"rangeSeg\" role=\"group\" aria-label=\"Plage de niveaux\">\n          <button class=\"seg-btn\" type=\"button\" data-range=\"a1b1\">A1–B1<\u002Fbutton>\n          <button class=\"seg-btn\" type=\"button\" data-range=\"a2b2\">A2–B2<\u002Fbutton>\n          <button class=\"seg-btn\" type=\"button\" data-range=\"all\">Tout<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"lvfilter\" id=\"lvfilter\">\n          <span class=\"flab\">Niveaux<\u002Fspan>\n        <\u002Fdiv>\n        <button class=\"btn\" id=\"evalBtn\" type=\"button\" aria-pressed=\"false\"><span class=\"dot\"><\u002Fspan>Mode surlignage<\u002Fbutton>\n        <button class=\"btn\" id=\"printBtn\" type=\"button\">Imprimer<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main>\n    <div class=\"wrap\" id=\"panels\"><\u002Fdiv>\n    <div class=\"wrap\"><p class=\"foot-note\">Filtrez les niveaux affichés via les pastilles. En mode surlignage, cliquez une cellule pour situer le niveau atteint sur une ligne — la sélection est conservée localement. Impression optimisée en A4 paysage (tous les modes).<\u002Fp><\u002Fdiv>\n  <\u002Fmain>\n\n  <script src=\"b55ef952-01ce-49d5-80ad-0a7af6db5b76\"><\u002Fscript>\n  <script>\n  (function(){\n    const ALL=NIVEAUX.map(n=>n[0]);                 // [\"preA1\",\"a1\",...]\n    const LAB=Object.fromEntries(NIVEAUX);          // {preA1:\"Pré A1\",...}\n    const esc=s=>(s||\"\").replace(/&/g,\"&amp;\").replace(/<\u002Fg,\"&lt;\").replace(/>/g,\"&gt;\");\n    const tabs=document.getElementById(\"tabs\");\n    const panels=document.getElementById(\"panels\");\n    const lvfilter=document.getElementById(\"lvfilter\");\n\n    // ---------- state ----------\n    let activeKey=SYNTHETIQUES[0].key;\n    try{const t=localStorage.getItem(\"synth.tab\"); if(t&&SYNTHETIQUES.some(m=>m.key===t)) activeKey=t;}catch(e){}\n    let shown={}; ALL.forEach(k=>shown[k]=true);\n    try{const s=JSON.parse(localStorage.getItem(\"synth.levels\")||\"null\"); if(s) ALL.forEach(k=>{if(k in s) shown[k]=!!s[k];});}catch(e){}\n    let marks={};\n    try{marks=JSON.parse(localStorage.getItem(\"synth.marks\")||\"{}\")||{};}catch(e){marks={};}\n\n    function visibleLevels(activity){\n      // intersection of globally-shown levels and levels actually present in this activity\n      const present={};\n      activity.rows.forEach(r=>ALL.forEach(k=>{ if(r[k] && r[k].trim()) present[k]=true; }));\n      return ALL.filter(k=>shown[k] && present[k]);\n    }\n\n    // ---------- build tabs ----------\n    SYNTHETIQUES.forEach((m,i)=>{\n      const t=document.createElement(\"button\");\n      t.className=\"tab\";t.type=\"button\";t.setAttribute(\"role\",\"tab\");t.dataset.key=m.key;\n      t.innerHTML='<span class=\"idx\">'+String(i+1).padStart(2,\"0\")+'<\u002Fspan>'+esc(m.mode);\n      t.addEventListener(\"click\",()=>select(m.key));\n      tabs.appendChild(t);\n    });\n\n    // ---------- build level filter ----------\n    const chipEls={};\n    NIVEAUX.forEach(([k,lab])=>{\n      const b=document.createElement(\"button\");\n      b.className=\"lvchip \"+k;b.type=\"button\";b.dataset.lv=k;b.textContent=lab;\n      b.dataset.on=String(shown[k]);\n      chipEls[k]=b;\n      b.addEventListener(\"click\",()=>{\n        shown[k]=!shown[k];b.dataset.on=String(shown[k]);\n        persistLevels();syncRangeSeg();renderPanels();\n      });\n      lvfilter.appendChild(b);\n    });\n\n    // ---------- range presets ----------\n    const RANGES={a1b1:[\"a1\",\"a2\",\"b1\"],a2b2:[\"a2\",\"b1\",\"b2\"],all:ALL.slice()};\n    const rangeSeg=document.getElementById(\"rangeSeg\");\n    function persistLevels(){try{localStorage.setItem(\"synth.levels\",JSON.stringify(shown));}catch(e){}}\n    function currentRange(){\n      for(const r in RANGES){\n        const set=RANGES[r];\n        if(ALL.every(k=>shown[k]===set.includes(k))) return r;\n      }\n      return null;\n    }\n    function syncRangeSeg(){\n      const r=currentRange();\n      rangeSeg.querySelectorAll(\".seg-btn\").forEach(b=>b.setAttribute(\"aria-pressed\",String(b.dataset.range===r)));\n    }\n    function applyRange(r){\n      const set=RANGES[r];\n      ALL.forEach(k=>{shown[k]=set.includes(k);chipEls[k].dataset.on=String(shown[k]);});\n      persistLevels();syncRangeSeg();renderPanels();\n    }\n    rangeSeg.querySelectorAll(\".seg-btn\").forEach(b=>b.addEventListener(\"click\",()=>applyRange(b.dataset.range)));\n\n    // ---------- render ----------\n    function tableHTML(m,ai,activity){\n      const LV=visibleLevels(activity);\n      if(!LV.length){\n        return '<p class=\"act-label\">'+esc(activity.name)+'<span class=\"as\">'+esc(activity.sub)+'<\u002Fspan><\u002Fp>'+\n               '<div class=\"tblwrap\"><p style=\"font-size:12.5px;color:var(--ink-faint);padding:6px 2px;\">Aucun niveau sélectionné n\\'est renseigné pour cette activité.<\u002Fp><\u002Fdiv>';\n      }\n      const cols='<col class=\"c-th\"/>'+LV.map(()=>'<col/>').join(\"\");\n      const heads=LV.map(k=>'<th><span class=\"badge '+k+'\">'+LAB[k]+'<\u002Fspan><\u002Fth>').join(\"\");\n      const rows=activity.rows.map((r,ri)=>{\n        const cells=LV.map(k=>{\n          const txt=r[k];\n          if(!txt||!txt.trim()) return '<td class=\"lv '+k+' empty\"><\u002Ftd>';\n          const id=m.key+'|'+ai+'|'+ri;\n          const marked=marks[id]===k?' mark':'';\n          return '<td class=\"lv '+k+marked+'\" data-id=\"'+id+'\" data-lv=\"'+k+'\">'+esc(txt)+'<\u002Ftd>';\n        }).join(\"\");\n        return '<tr><td class=\"th\">'+esc(r.theme)+'<\u002Ftd>'+cells+'<\u002Ftr>';\n      }).join(\"\");\n      return '<p class=\"act-label\">'+esc(activity.name)+'<span class=\"as\">'+esc(activity.sub)+'<\u002Fspan><\u002Fp>'+\n        '<div class=\"tblwrap\"><table class=\"tbl\"><colgroup>'+cols+'<\u002Fcolgroup>'+\n        '<thead><tr><th class=\"th-h\">Activité / thème<\u002Fth>'+heads+'<\u002Ftr><\u002Fthead>'+\n        '<tbody>'+rows+'<\u002Ftbody><\u002Ftable><\u002Fdiv>';\n    }\n\n    function modeHTML(m,i){\n      const legend=NIVEAUX.map(([k,lab])=>'<span class=\"lv\"><span class=\"sw '+k+'\"><\u002Fspan>'+lab+'<\u002Fspan>').join(\"\");\n      const acts=m.activities.map((a,ai)=>tableHTML(m,ai,a)).join(\"\");\n      return '<div class=\"sheet\">'+\n        '<div class=\"mode-head\"><div class=\"lead\"><span class=\"mode-no\">'+String(i+1).padStart(2,\"0\")+'<\u002Fspan>'+\n        '<div><h2 class=\"mode-name\">'+esc(m.mode)+'<\u002Fh2><p class=\"mode-tag\">'+esc(m.tagline)+'<\u002Fp><\u002Fdiv><\u002Fdiv>'+\n        '<div class=\"legend\">'+legend+'<\u002Fdiv><\u002Fdiv>'+acts+'<\u002Fdiv>';\n    }\n\n    function renderPanels(){\n      panels.innerHTML=\"\";\n      SYNTHETIQUES.forEach((m,i)=>{\n        const sec=document.createElement(\"section\");\n        sec.className=\"mode\"+(m.key===activeKey?\" active\":\"\");\n        sec.dataset.key=m.key;\n        sec.innerHTML=modeHTML(m,i);\n        panels.appendChild(sec);\n      });\n      document.querySelectorAll(\".tab\").forEach(t=>t.setAttribute(\"aria-selected\",t.dataset.key===activeKey?\"true\":\"false\"));\n    }\n\n    function select(key){\n      activeKey=key;\n      document.querySelectorAll(\".mode\").forEach(s=>s.classList.toggle(\"active\",s.dataset.key===key));\n      document.querySelectorAll(\".tab\").forEach(t=>t.setAttribute(\"aria-selected\",t.dataset.key===key?\"true\":\"false\"));\n      try{localStorage.setItem(\"synth.tab\",key);}catch(e){}\n      window.scrollTo({top:0,behavior:\"instant\"in window?\"instant\":\"auto\"});\n    }\n\n    // ---------- highlight mode ----------\n    const evalBtn=document.getElementById(\"evalBtn\");\n    let evalOn=false;\n    evalBtn.addEventListener(\"click\",()=>{\n      evalOn=!evalOn;document.body.classList.toggle(\"eval\",evalOn);\n      evalBtn.classList.toggle(\"on\",evalOn);evalBtn.setAttribute(\"aria-pressed\",String(evalOn));\n    });\n    panels.addEventListener(\"click\",e=>{\n      if(!evalOn) return;\n      const cell=e.target.closest(\".lv\");\n      if(!cell||cell.classList.contains(\"empty\")) return;\n      const id=cell.dataset.id, lv=cell.dataset.lv, row=cell.parentElement;\n      const already=cell.classList.contains(\"mark\");\n      row.querySelectorAll(\".lv.mark\").forEach(c=>c.classList.remove(\"mark\"));\n      if(already){delete marks[id];}else{cell.classList.add(\"mark\");marks[id]=lv;}\n      try{localStorage.setItem(\"synth.marks\",JSON.stringify(marks));}catch(e){}\n    });\n\n    // ---------- print ----------\n    document.getElementById(\"printBtn\").addEventListener(\"click\",()=>window.print());\n\n    // ---------- count chip ----------\n    let nDesc=0;\n    SYNTHETIQUES.forEach(m=>m.activities.forEach(a=>a.rows.forEach(r=>ALL.forEach(k=>{if(r[k]&&r[k].trim())nDesc++;}))));\n    document.getElementById(\"cntChip\").textContent=nDesc+\" descripteurs officiels\";\n\n    // ---------- init ----------\n    syncRangeSeg();\n    renderPanels();\n  })();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
